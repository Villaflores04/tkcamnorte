<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalendaryo · TK Cam Norte</title>
  <meta name="theme-color" content="#0A2048">
  <script>(function(){try{var t=localStorage.getItem('tk-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link rel="stylesheet" href="/css/hub.css"></head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Kalendaryo</small></div>
    </a>
    <div class="header-actions" id="headerActions">
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications"><span class="icon" data-icon="bell" aria-hidden="true"></span><em id="notifyBadge" hidden>0</em></button>
      <button class="hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false"><span class="icon" data-icon="menu" aria-hidden="true"></span></button>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <section class="page-head">
      <div class="eyebrow">PLAN AHEAD</div><h1>Schedule</h1>
      <p>Activity dates and deadlines, in Philippine time.</p>
    </section>
    <section class="card">
      <div class="cal-nav">
        <button type="button" id="prevMonth"><span class="icon" data-icon="chevronLeft" aria-hidden="true"></span></button>
        <strong id="monthLabel"></strong>
        <button type="button" id="nextMonth"><span class="icon" data-icon="chevronRight" aria-hidden="true"></span></button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>
    <section>
      <h2 id="dayTitle" style="margin:16px 0 10px">Mga event</h2>
      <div id="dayList"></div>
    </section>
  </main>
  <div id="bottomNavHost"></div>
  <script type="module">
    import { requireAuth, initShell, apiJson, escapeHtml, formatDate, categoryLabel, bottomNav, parseDateValue } from '/js/common.js';
    import { todayKey } from '/js/dates.js';
    const user = await requireAuth();
    if (!user) throw new Error('auth');
    initShell(user);
    document.getElementById('bottomNavHost').innerHTML = bottomNav('calendar');

    let cursor = parseDateValue(todayKey());
    cursor.setDate(1);
    let selected = parseDateValue(todayKey());
    let items = [];

    function ymd(d) {
      const x = parseDateValue(d);
      if (Number.isNaN(x.getTime())) return '';
      return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
    }
    function onDay(a, day) {
      const activity = a.starts_at && day >= a.starts_at && day <= (a.ends_at || a.starts_at);
      return Boolean(activity || a.deadline_date === day);
    }

    function renderMonth() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      document.getElementById('monthLabel').textContent = cursor.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const days = new Date(year, month + 1, 0).getDate();
      const marked = new Set();
      for (let day=1;day<=days;day++) { const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; if (items.some(a => onDay(a,key))) marked.add(key); }
      const cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="cal-dow">${d}</div>`);
      for (let i = 0; i < firstDow; i++) cells.push('<div></div>');
      const today = todayKey();
      const sel = ymd(selected);
      for (let day = 1; day <= days; day++) {
        const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cls = ['cal-day', marked.has(date) ? 'has' : '', date === sel ? 'selected' : '', date === today ? 'today' : ''].filter(Boolean).join(' ');
        cells.push(`<button type="button" class="${cls}" aria-label="${formatDate(date)}${marked.has(date) ? ', has scheduled updates' : ''}" aria-pressed="${date === sel}" data-day="${date}">${day}</button>`);
      }
      const grid = document.getElementById('calGrid');
      grid.innerHTML = cells.join('');
      grid.querySelectorAll('[data-day]').forEach((btn) => {
        btn.onclick = () => {
          selected = parseDateValue(btn.dataset.day);
          renderMonth();
          renderDay();
        };
      });
    }

    function renderDay() {
      const key = ymd(selected);
      document.getElementById('dayTitle').textContent = formatDate(selected) || 'Mga event';
      const hits = items.filter((a) => onDay(a,key));
      const box = document.getElementById('dayList');
      if (!hits.length) {
        box.innerHTML = '<div class="card empty">Walang anunsyo sa araw na ito.</div>';
        return;
      }
      box.innerHTML = hits.map((a) => `
        <a class="card" href="/announcement.html?id=${encodeURIComponent(a.id)}" style="display:block">
          <span class="badge badge-cat">${a.deadline_date === key ? 'Deadline' : 'Activity'}</span>
          <p class="meta">${escapeHtml(a.venue || '')}${a.call_time ? ' · Call time '+escapeHtml(a.call_time.slice(0,5))+' PHT' : ''}</p><h3 style="margin-top:8px">${escapeHtml(a.title)}</h3>
          <p class="meta">${a.starts_at || a.ends_at ? `${escapeHtml(formatDate(a.starts_at) || '—')} → ${escapeHtml(formatDate(a.ends_at || a.deadline_date) || '—')}` : escapeHtml(formatDate(a.deadline_date))}</p>
        </a>
      `).join('');
    }

    document.getElementById('prevMonth').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); selected = new Date(cursor); renderMonth(); renderDay(); };
    document.getElementById('nextMonth').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); selected = new Date(cursor); renderMonth(); renderDay(); };

    const { ok, data, error } = await apiJson('/announcements');
    items = ok && Array.isArray(data) ? data : [];
    renderMonth();
    if (!ok) { document.getElementById('dayList').innerHTML = `<div class="card empty"><h3>Unable to load schedule</h3><p>${escapeHtml(error)}</p><button class="btn" id="retrySchedule">Try again</button></div>`; document.getElementById('retrySchedule').onclick = () => location.reload(); }
    else renderDay();
  </script>
</body>
</html>
