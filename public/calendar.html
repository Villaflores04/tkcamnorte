<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalendaryo · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/premium.css">
  <link rel="stylesheet" href="/css/fixes.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Kalendaryo</small></div>
    </a>
    <div class="header-actions" id="headerActions">
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications"><span aria-hidden="true">🔔</span><em id="notifyBadge" hidden>0</em></button>
      <button class="hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <section class="page-head">
      <h1>Kalendaryo</h1>
      <p>Mga anunsyo ayon sa start, end, at deadline dates.</p>
    </section>
    <section class="card">
      <div class="cal-nav">
        <button type="button" id="prevMonth">‹</button>
        <strong id="monthLabel"></strong>
        <button type="button" id="nextMonth">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>
    <section>
      <h2 id="dayTitle" style="margin:16px 0 10px">Mga event</h2>
      <div id="dayList"></div>
    </section>
  </main>
  <div id="bottomNavHost"></div>
  <script type="module">
    import { requireAuth, initShell, apiJson, escapeHtml, formatDate, categoryLabel, bottomNav } from '/js/common.js';
    const user = await requireAuth();
    if (!user) throw new Error('auth');
    initShell(user);
    document.getElementById('bottomNavHost').innerHTML = bottomNav('calendar');

    let cursor = new Date();
    cursor.setDate(1);
    let selected = new Date();
    let items = [];

    function ymd(d) {
      const x = new Date(d);
      if (Number.isNaN(x.getTime())) return '';
      return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
    }
    function datesOf(a) {
      const out = new Set();
      [a.starts_at, a.ends_at, a.deadline_date].forEach((v) => { if (v) out.add(ymd(v)); });
      if (a.starts_at && (a.ends_at || a.deadline_date)) {
        const start = new Date(a.starts_at);
        const end = new Date(a.ends_at || a.deadline_date);
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.add(ymd(d));
      }
      return [...out];
    }

    function renderMonth() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      document.getElementById('monthLabel').textContent = cursor.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
      const firstDow = new Date(year, month, 1).getDay();
      const days = new Date(year, month + 1, 0).getDate();
      const marked = new Set();
      items.forEach((a) => datesOf(a).forEach((d) => marked.add(d)));
      const cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<div class="cal-dow">${d}</div>`);
      for (let i = 0; i < firstDow; i++) cells.push('<div></div>');
      const today = ymd(new Date());
      const sel = ymd(selected);
      for (let day = 1; day <= days; day++) {
        const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cls = ['cal-day', marked.has(date) ? 'has' : '', date === sel ? 'selected' : '', date === today ? 'today' : ''].filter(Boolean).join(' ');
        cells.push(`<button type="button" class="${cls}" data-day="${date}">${day}</button>`);
      }
      const grid = document.getElementById('calGrid');
      grid.innerHTML = cells.join('');
      grid.querySelectorAll('[data-day]').forEach((btn) => {
        btn.onclick = () => {
          selected = new Date(btn.dataset.day);
          renderMonth();
          renderDay();
        };
      });
    }

    function renderDay() {
      const key = ymd(selected);
      document.getElementById('dayTitle').textContent = formatDate(selected) || 'Mga event';
      const hits = items.filter((a) => datesOf(a).includes(key));
      const box = document.getElementById('dayList');
      if (!hits.length) {
        box.innerHTML = '<div class="card empty">Walang anunsyo sa araw na ito.</div>';
        return;
      }
      box.innerHTML = hits.map((a) => `
        <a class="card" href="/announcement.html?id=${encodeURIComponent(a.id)}" style="display:block">
          <span class="badge badge-cat">${escapeHtml(categoryLabel(a.category))}</span>
          <h3 style="margin-top:8px">${escapeHtml(a.title)}</h3>
          <p class="meta">${a.starts_at || a.ends_at ? `${escapeHtml(formatDate(a.starts_at) || '—')} → ${escapeHtml(formatDate(a.ends_at || a.deadline_date) || '—')}` : escapeHtml(formatDate(a.deadline_date))}</p>
        </a>
      `).join('');
    }

    document.getElementById('prevMonth').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); renderMonth(); };
    document.getElementById('nextMonth').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); renderMonth(); };

    const { ok, data, error } = await apiJson('/announcements');
    items = ok && Array.isArray(data) ? data : [];
    if (!ok) document.getElementById('dayList').innerHTML = `<div class="card empty">${escapeHtml(error)}</div>`;
    renderMonth();
    renderDay();
  </script>
</body>
</html>
