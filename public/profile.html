<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Profile</small></div>
    </a>
    <button class="hamburger" id="hamburger" type="button" aria-label="Menu">☰</button>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <div class="page-head">
      <h1>My profile</h1>
      <p>Pangalan, larawan, at password.</p>
    </div>
    <section class="card profile-card">
      <div class="profile-hero">
        <img id="profileImage" class="profile-photo" alt="Profile">
        <div class="profile-id">
          <h2 id="displayFullName"></h2>
          <p class="meta">@<span id="displayUsername"></span> · <span id="displayRole"></span></p>
        </div>
      </div>
      <div class="field">
        <label for="profileImageUpload">Bagong larawan</label>
        <input type="file" id="profileImageUpload" accept="image/*">
      </div>
      <div class="btn-row single">
        <button class="btn" id="uploadProfileImageBtn" type="button">Upload photo</button>
      </div>
    </section>
    <section class="card">
      <h2>Palitan ang pangalan</h2>
      <form id="updateProfileForm">
        <div class="field">
          <label for="editFullName">Buong pangalan</label>
          <input id="editFullName" required>
        </div>
        <p class="form-error" id="nameError" hidden></p>
        <button class="btn btn-yellow" type="submit">Save name</button>
      </form>
    </section>
    <section class="card">
      <h2>Palitan ang password</h2>
      <form id="changePasswordForm">
        <div class="field">
          <label for="oldPassword">Lumang password</label>
          <input id="oldPassword" type="password" required>
        </div>
        <div class="field">
          <label for="newPassword">Bagong password</label>
          <input id="newPassword" type="password" minlength="8" required>
        </div>
        <p class="form-error" id="passError" hidden></p>
        <button class="btn" type="submit">Change password</button>
      </form>
    </section>
  </main>
  <script type="module">
    import {
      requireAuth, initShell, apiJson, setUser, clearSession, uploadFiles,
      showToast, setFormError
    } from '/js/common.js';

    const sessionUser = await requireAuth();
    if (!sessionUser) throw new Error('auth');
    initShell(sessionUser);

    async function loadProfile() {
      const { ok, data, error } = await apiJson('/users/profile');
      if (!ok) return showToast(error, 'error');
      setUser(data);
      document.getElementById('displayFullName').textContent = data.fullName;
      document.getElementById('displayUsername').textContent = data.username;
      document.getElementById('displayRole').textContent = data.role === 'admin' ? 'Coordinator' : 'Member';
      document.getElementById('editFullName').value = data.fullName;
      const img = document.getElementById('profileImage');
      img.src = data.profileImageUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.fullName)}&background=0b1f4a&color=f5c518`;
    }

    document.getElementById('updateProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('editFullName').value.trim();
      const { ok, data, error } = await apiJson('/users/profile', {
        method: 'PUT',
        body: JSON.stringify({ fullName })
      });
      if (!ok) return setFormError('nameError', error);
      setUser(data.user);
      initShell(data.user);
      setFormError('nameError', '');
      showToast('Na-update ang pangalan.', 'success');
      loadProfile();
    });

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { ok, error } = await apiJson('/users/profile', {
        method: 'PUT',
        body: JSON.stringify({
          oldPassword: document.getElementById('oldPassword').value,
          newPassword: document.getElementById('newPassword').value
        })
      });
      if (!ok) return setFormError('passError', error);
      clearSession();
      location.href = '/login.html';
    });

    document.getElementById('uploadProfileImageBtn').addEventListener('click', async () => {
      const file = document.getElementById('profileImageUpload').files[0];
      if (!file) return showToast('Pumili muna ng larawan.', 'error');
      try {
        const files = await uploadFiles([file], 'profile-images');
        const { ok, data, error } = await apiJson('/users/profile', {
          method: 'PUT',
          body: JSON.stringify({ profileImageUrl: files[0].fileUrl })
        });
        if (!ok) return showToast(error, 'error');
        setUser(data.user);
        showToast('Na-update ang larawan.', 'success');
        loadProfile();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    loadProfile();
  </script>
</body>
</html>
