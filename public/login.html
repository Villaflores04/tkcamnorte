<!DOCTYPE html><html lang="fil"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Login · TK Cam Norte</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/premium.css"><link rel="stylesheet" href="/css/fixes.css"><link rel="stylesheet" href="/css/next.css"><link rel="stylesheet" href="/css/globe-redesign.css"></head><body class="auth-page"><main class="auth-wrap"><div class="auth-ambient"><span></span><span></span><span></span></div><section class="auth-card"><div class="auth-brand"><div class="mark mark-large">TK</div><div class="brand-name">TK Cam Norte<small>Teatro Kristiano</small></div></div><div class="auth-heading"><div class="eyebrow">MEMBER ACCESS</div><h1>Welcome back.</h1><p>Stay connected with announcements, activities, schedules, and important updates.</p></div><form id="loginForm" class="auth-form"><div class="field"><label for="username">Username</label><div class="input-shell"><span class="input-icon icon" data-icon="user"></span><input id="username" autocomplete="username" required placeholder="Enter your username"></div></div><div class="field"><label for="password">Password</label><div class="password-wrap input-shell"><span class="input-icon icon" data-icon="lock"></span><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" data-toggle="password" aria-label="Show password"><span class="icon" data-icon="eye"></span></button></div></div><p class="form-error" id="formError" hidden aria-live="polite"></p><button class="btn auth-submit" type="submit" id="submitBtn"><span class="label">Login</span><span class="icon" data-icon="arrowRight"></span></button></form><div class="auth-divider"><span>New to TK Cam Norte?</span></div><a class="register-link" href="/register.html">Create a member account <span class="icon" data-icon="arrowRight"></span></a><div class="auth-mini-note"><span class="status-dot"></span>Private member announcement system</div></section></main><div id="loginBumper" class="login-bumper" aria-hidden="true"><div class="bumper-logo">TK</div><div class="bumper-ring"></div></div><script type="module">import{setToken,setUser,apiJson,getToken,refreshSession,setFormError,hydrateIcons,icon,mountThemeToggle}from'/js/common.js';hydrateIcons(document);const host=document.createElement('div');host.style.cssText='position:fixed;top:18px;right:18px;z-index:120';document.body.appendChild(host);mountThemeToggle(host);if(getToken()){const user=await refreshSession();if(user)location.href='/';}document.querySelector('[data-toggle="password"]').onclick=()=>{const input=document.getElementById('password'),button=document.querySelector('[data-toggle="password"]'),show=input.type==='password';input.type=show?'text':'password';button.innerHTML=show?icon('eyeOff'):icon('eye');button.setAttribute('aria-label',show?'Hide password':'Show password')};document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();setFormError('formError','');const btn=document.getElementById('submitBtn');btn.disabled=true;btn.classList.add('loading');btn.querySelector('.label').textContent='Signing in';const{ok,data,error}=await apiJson('/auth/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});if(!ok){btn.disabled=false;btn.classList.remove('loading');btn.querySelector('.label').textContent='Login';setFormError('formError',error||'Mali ang username o password.');return}setToken(data.token);setUser(data.user);btn.classList.add('success');btn.querySelector('.label').textContent='Welcome';document.getElementById('loginBumper').classList.add('show');setTimeout(()=>location.href='/',950)});</script></body></html>
