<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/premium.css">
  <link rel="stylesheet" href="/css/fixes.css">
  <link rel="stylesheet" href="/css/next.css">
  <meta name="theme-color" content="#0A2048">
  <script>(function(){try{var t=localStorage.getItem('tk-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();</script>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-orbit auth-orbit-a"></div><div class="auth-orbit auth-orbit-b"></div>
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="mark mark-large" aria-hidden="true"><span>TK</span></div>
        <div class="brand-name">Teatro Kristiano<small>Camarines Norte</small></div>
      </div>
      <div class="auth-heading"><h1>Welcome back</h1><p>Stay connected with announcements, activities, and updates from TK Cam Norte.</p></div>
      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-shell"><span class="input-icon icon" data-icon="user" aria-hidden="true"></span><input id="username" autocomplete="username" required placeholder="Enter your username"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap input-shell"><span class="input-icon icon" data-icon="lock" aria-hidden="true"></span><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" data-toggle="password" aria-label="Show password"><span class="icon" data-icon="eye" aria-hidden="true"></span></button></div>
        </div>
        <p class="form-error" id="formError" hidden aria-live="polite"></p>
        <button class="btn auth-submit" type="submit" id="submitBtn"><span>Login</span><span class="icon" data-icon="arrowRight" aria-hidden="true"></span></button>
      </form>
      <p class="meta auth-foot">Wala pang account?</p>
      <a class="register-link" href="/register.html">Magrehistro <span class="icon" data-icon="arrowRight" aria-hidden="true"></span></a>
    </div>
  </main>
  <script type="module">
    import { setToken, setUser, apiJson, redirectBasedOnRole, getToken, refreshSession, setFormError, hydrateIcons, icon, mountThemeToggle } from '/js/common.js';
    hydrateIcons(document);
    const themeHost = document.createElement('div');
    themeHost.style.cssText = 'position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:5';
    document.querySelector('.auth-wrap').appendChild(themeHost);
    mountThemeToggle(themeHost);
    if (getToken()) { const user = await refreshSession(); if (user) redirectBasedOnRole(user.role); }
    document.querySelector('[data-toggle="password"]').onclick = () => {
      const input = document.getElementById('password'), button = document.querySelector('[data-toggle="password"]');
      const show = input.type === 'password'; input.type = show ? 'text' : 'password';
      button.innerHTML = show ? icon('eyeOff') : icon('eye'); button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    };
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); setFormError('formError', ''); const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.querySelector('span').textContent = 'Nagla-login...';
      const { ok, data, error } = await apiJson('/auth/login', { method:'POST', body:JSON.stringify({ username:document.getElementById('username').value.trim(), password:document.getElementById('password').value }) });
      btn.disabled = false; btn.querySelector('span').textContent = 'Login';
      if (!ok) { setFormError('formError', error || 'Mali ang username o password.'); return; }
      setToken(data.token); setUser(data.user); redirectBasedOnRole(data.user.role);
    });
  </script>
</body>
</html>
