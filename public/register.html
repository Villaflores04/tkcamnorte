<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="brand">
        <div class="mark">TK</div>
        <div class="brand-name">Teatro Kristiano<small>Camarines Norte</small></div>
      </div>
      <h1>Magrehistro</h1>
      <p class="lede">Regular member ang bagong account. Coordinator ang magpo-promote.</p>
      <form id="registerForm">
        <div class="field">
          <label for="fullName">Buong pangalan</label>
          <input id="fullName" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" required>
          <p class="meta" style="margin-top:6px">3–24 letters, numbers, dot o underscore.</p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm">Ulitin ang password</label>
          <input id="confirm" type="password" minlength="8" required>
        </div>
        <p class="form-error" id="formError" hidden></p>
        <button class="btn btn-yellow" type="submit" id="submitBtn">Create account</button>
      </form>
      <p class="meta auth-foot">May account na? <a href="/login.html">Login</a></p>
    </div>
  </main>
  <script type="module">
    import { setToken, setUser, apiJson, setFormError } from '/js/common.js';
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) return setFormError('formError', 'Hindi tugma ang password.');
      if (password.length < 8) return setFormError('formError', '8 characters pataas ang password.');
      if (!/^[a-zA-Z0-9._]{3,24}$/.test(username)) return setFormError('formError', 'Invalid username format.');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      const { ok, data, error } = await apiJson('/auth/register', { method: 'POST', body: JSON.stringify({ fullName, username, password }) });
      btn.disabled = false;
      if (!ok) return setFormError('formError', error);
      setToken(data.token); setUser(data.user); location.href = '/';
    });
  </script>
</body>
</html>
