<!DOCTYPE html><html lang="fil"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Register · TK Cam Norte</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/premium.css"><link rel="stylesheet" href="/css/fixes.css"><link rel="stylesheet" href="/css/next.css"><link rel="stylesheet" href="/css/globe-redesign.css"></head><body class="auth-page"><main class="auth-wrap"><div class="auth-ambient"><span></span><span></span><span></span></div><section class="auth-card"><div class="auth-brand"><div class="mark mark-large">TK</div><div class="brand-name">TK Cam Norte<small>Teatro Kristiano</small></div></div><div class="auth-heading"><div class="eyebrow">MEMBER REGISTRATION</div><h1>Create your account.</h1><p>Join the private TK Cam Norte announcement community. Coordinator roles are managed separately.</p></div><form id="registerForm" class="auth-form"><div class="field"><label for="fullName">Buong pangalan</label><input id="fullName" autocomplete="name" required placeholder="Enter your full name"></div><div class="field"><label for="username">Username</label><div class="input-shell"><span class="input-icon icon" data-icon="user"></span><input id="username" autocomplete="username" required placeholder="Choose a username"></div><p class="meta" style="margin-top:7px">3–24 letters, numbers, dot o underscore.</p></div><div class="field"><label for="password">Password</label><div class="password-wrap input-shell"><span class="input-icon icon" data-icon="lock"></span><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Create a password"><button type="button" data-pw="password" aria-label="Show password"><span class="icon" data-icon="eye"></span></button></div></div><div class="field"><label for="confirm">Ulitin ang password</label><div class="password-wrap input-shell"><span class="input-icon icon" data-icon="lock"></span><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Confirm your password"><button type="button" data-pw="confirm" aria-label="Show password"><span class="icon" data-icon="eye"></span></button></div></div><p class="form-error" id="formError" hidden aria-live="polite"></p><button class="btn btn-yellow auth-submit" type="submit" id="submitBtn"><span class="label">Create account</span><span class="icon" data-icon="arrowRight"></span></button></form><div class="auth-divider"><span>Already a member?</span></div><a class="register-link" href="/login.html">Back to login <span class="icon" data-icon="arrowRight"></span></a><div class="auth-mini-note"><span class="status-dot"></span>Private member registration</div></section></main><script type="module">import{setToken,setUser,apiJson,setFormError,hydrateIcons,icon,mountThemeToggle}from'/js/common.js';hydrateIcons(document);const host=document.createElement('div');host.style.cssText='position:fixed;top:18px;right:18px;z-index:120';document.body.appendChild(host);mountThemeToggle(host);document.querySelectorAll('[data-pw]').forEach(button=>button.onclick=()=>{const input=document.getElementById(button.dataset.pw),show=input.type==='password';input.type=show?'text':'password';button.innerHTML=show?icon('eyeOff'):icon('eye');button.setAttribute('aria-label',show?'Hide password':'Show password')});document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();setFormError('formError','');const fullName=document.getElementById('fullName').value.trim(),username=document.getElementById('username').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm)return setFormError('formError','Hindi tugma ang password.');if(password.length<8)return setFormError('formError','8 characters pataas ang password.');if(!/^[a-zA-Z0-9._]{3,24}$/.test(username))return setFormError('formError','Invalid username format.');const btn=document.getElementById('submitBtn');btn.disabled=true;btn.classList.add('loading');btn.querySelector('.label').textContent='Creating account';const{ok,data,error}=await apiJson('/auth/register',{method:'POST',body:JSON.stringify({fullName,username,password})});if(!ok){btn.disabled=false;btn.classList.remove('loading');btn.querySelector('.label').textContent='Create account';return setFormError('formError',error||'Registration failed.')}setToken(data.token);setUser(data.user);btn.classList.add('success');btn.querySelector('.label').textContent='Welcome';setTimeout(()=>location.href='/',700)});</script></body></html>
