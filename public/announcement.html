<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anunsyo · TK Cam Norte</title>
  <meta name="theme-color" content="#0A2048">
  <script>(function(){try{var t=localStorage.getItem('tk-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();</script>
<link rel="stylesheet" href="/css/hub.css"></head>
<body>
  <header class="topbar">
    <a class="brand" href="/announcements.html">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Comment thread</small></div>
    </a>
    <div class="header-actions" id="headerActions">
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications"><span class="icon" data-icon="bell" aria-hidden="true"></span><em id="notifyBadge" hidden>0</em></button>
      <button class="hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false"><span class="icon" data-icon="menu" aria-hidden="true"></span></button>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <p class="meta" style="margin-bottom:12px"><a href="/" style="display:inline-flex;align-items:center;gap:4px"><span class="icon" data-icon="chevronLeft" aria-hidden="true" style="width:14px;height:14px"></span> Balik sa anunsyo</a></p>
    <div id="post"></div><section id="responseCard" class="ack-panel" hidden></section>
    <section class="card comments-card" aria-labelledby="commentsHeading">
      <h2 id="commentsHeading">Comments <span class="comment-count" id="commentCount">0</span></h2>
      <form class="composer composer-main" id="commentForm">
        <textarea rows="1" maxlength="1000" id="commentText" placeholder="Ask a question or leave a comment…" aria-label="Write a comment"></textarea>
        <button class="btn" id="sendComment" type="submit">Post</button>
      </form>
      <div id="comments" class="comments-list"></div>
    </section>
  </main>
  <div id="bottomNavHost"></div>
  <script type="module">
    import {
      requireAuth, initShell, apiJson, escapeHtml, formatDate, relativeTime,
      deadlineMeta, categoryLabel, renderReactions, bindReactions,
      avatarUrl, bottomNav, coverOf, isOngoing, icon, loadNotifications
    } from '/js/common.js';

    import { versionOf } from '/js/dates.js';
    import { renderAcknowledgment } from '/js/acknowledge.js';
    import { initComments } from '/js/comments.js';
    let currentPost;
    const user = await requireAuth();
    if (!user) throw new Error('auth');
    initShell(user);
    document.getElementById('bottomNavHost').innerHTML = bottomNav('feed');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = '/';

    async function loadPost() {
      const box = document.getElementById('post');
      const { ok, data, error } = await apiJson(`/announcements?id=${encodeURIComponent(id)}`);
      if (!ok) { box.innerHTML = `<div class="card empty">${escapeHtml(error)}</div>`; return; }
      currentPost = data;
      const due = deadlineMeta(data.deadline_date || data.ends_at);
      const author = data.created_by_user || {};
      const cover = coverOf(data);
      const files = Array.isArray(data.attachments) ? data.attachments : [];
      box.innerHTML = `<article class="card announcement ${data.is_pinned ? 'pinned' : ''}">
        <div class="tag-row">
          ${isOngoing(data) ? '<span class="badge badge-soon">Ongoing</span>' : ''}
          <span class="badge badge-cat">${escapeHtml(categoryLabel(data.category))}</span>
          ${data.is_pinned ? `<span class="badge badge-pin">${icon('pin')}Pinned</span>` : ''}
        </div>
        <h1>${escapeHtml(data.title)}</h1>
        <p class="body-text">${escapeHtml(data.content)}</p>
        ${data.voice_url ? `<div class="voice-card"><div class="voice-card-head"><span class="icon" aria-hidden="true">${icon('mic')}</span><strong>Voice message</strong>${Number.isInteger(data.voice_duration) ? `<span class="meta">${Math.floor(data.voice_duration / 60)}:${String(data.voice_duration % 60).padStart(2, '0')}</span>` : ''}</div><audio controls preload="metadata" src="${escapeHtml(data.voice_url)}">Your browser cannot play this voice message.</audio></div>` : ''}
        ${due ? `<div class="deadline-box"><strong>${icon('clock')}${escapeHtml(due.label)}</strong><span class="meta">${escapeHtml(formatDate(data.deadline_date || data.ends_at))}</span></div>` : ''}
        ${data.starts_at || data.ends_at ? `<p class="meta">Duration: ${escapeHtml(formatDate(data.starts_at) || '—')} → ${escapeHtml(formatDate(data.ends_at || data.deadline_date) || '—')}</p>` : ''}
        ${cover ? `<img class="post-cover"  src="${escapeHtml(cover)}" alt="">` : ''}
        ${data.venue || data.call_time ? `<div class="notice">${data.venue ? `<strong>Venue:</strong> ${escapeHtml(data.venue)}` : ''}${data.call_time ? `<br><strong>Call time:</strong> ${escapeHtml(data.call_time.slice(0,5))} PHT (Asia/Manila)` : ''}</div>` : ''}
        <div class="author-row">
          <img src="${escapeHtml(avatarUrl(author, author.full_name))}" alt="">
          <div><strong>${escapeHtml(author.full_name || 'Coordinator')}</strong><p class="meta">${relativeTime(data.created_at)}${data.updated_at && Date.parse(data.updated_at) > Date.parse(data.created_at) + 1000 ? ` · Updated ${escapeHtml(formatDate(data.updated_at, true))}` : ''}</p></div>
        </div>
        ${files.length ? `<div class="attachments">${files.map((f) => `<a href="${escapeHtml(f.file_url)}" target="_blank" rel="noopener">${icon('doc')}${escapeHtml(f.file_name || 'File')}</a>`).join('')}</div>` : ''}
        ${renderReactions(data)}
      </article>`;
      bindReactions(box);
      document.title = `${data.title} · TK Cam Norte`;
      const read = await apiJson('/announcements?resource=receipts', {method:'POST', body:JSON.stringify({announcementId:id,action:'read',version:versionOf(data)})});
      if (read.ok) loadNotifications();
      await renderAcknowledgment({ box: document.getElementById('responseCard'), post: currentPost, user, id });
    }


    loadPost();
    initComments({ announcementId: id, user, listEl: document.getElementById('comments'), formEl: document.getElementById('commentForm') });
  </script>
</body>
</html>
