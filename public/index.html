<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anunsyo · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Teatro Kristiano</small></div>
    </a>
    <button class="hamburger" id="hamburger" type="button" aria-label="Menu">☰</button>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <div class="page-head">
      <h1>Mga anunsyo</h1>
      <p>Song line-up, deadline, ambag, at project ng chapter.</p>
    </div>
    <div class="chip-row" id="filters"></div>
    <div id="announcementsList"></div>
  </main>
  <script type="module">
    import {
      requireAuth, initShell, apiJson, escapeHtml, formatDate, deadlineMeta,
      categoryLabel, CATEGORIES, renderReactions, bindReactions, isAdmin,
      getUser, showToast
    } from '/js/common.js';

    const user = await requireAuth();
    if (!user) throw new Error('auth');
    initShell(user);

    let currentCategory = 'all';
    const filters = document.getElementById('filters');
    filters.innerHTML = CATEGORIES.map((c) =>
      `<button class="chip ${c.id === 'all' ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
    ).join('');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      currentCategory = btn.dataset.cat;
      filters.querySelectorAll('.chip').forEach((el) => el.classList.toggle('active', el === btn));
      loadAnnouncements();
    });

    async function loadAnnouncements() {
      const box = document.getElementById('announcementsList');
      box.innerHTML = '<div class="card empty">Loading...</div>';
      const qs = currentCategory !== 'all' ? `?category=${currentCategory}` : '';
      const { ok, data, error } = await apiJson(`/announcements${qs}`);
      if (!ok) {
        box.innerHTML = `<div class="card empty">${escapeHtml(error)}</div>`;
        return;
      }
      if (!data.length) {
        box.innerHTML = '<div class="card empty">Wala pang anunsyo sa category na ito.</div>';
        return;
      }
      box.innerHTML = data.map(renderCard).join('');
      bindReactions(box);
      data.forEach((a) => loadComments(a.id));
      bindCommentEvents(box);
    }

    function renderCard(a) {
      const due = deadlineMeta(a.deadline_date);
      const admin = isAdmin();
      return `
        <article class="card announcement cat-${escapeHtml(a.category)} ${a.is_pinned ? 'pinned' : ''}" data-post="${a.id}">
          <div class="tag-row">
            <span class="badge badge-cat">${escapeHtml(categoryLabel(a.category))}</span>
            ${a.is_pinned ? '<span class="badge badge-pin">Pinned</span>' : ''}
            ${due ? `<span class="badge badge-${due.tone}">${due.label}</span>` : ''}
          </div>
          <h3>${escapeHtml(a.title)}</h3>
          <p class="body-text">${escapeHtml(a.content)}</p>
          <p class="meta">${escapeHtml(a.created_by_user?.full_name || 'Coordinator')} · ${formatDate(a.created_at, true)}</p>
          <div class="attachments">
            ${(a.attachments || []).map((f) => `<a href="${escapeHtml(f.file_url)}" target="_blank" rel="noopener">${escapeHtml(f.file_name || 'File')}</a>`).join('')}
          </div>
          ${renderReactions(a)}
          ${admin ? `<div class="btn-row"><a class="btn btn-ghost" href="/admin.html?edit=${a.id}">Edit</a></div>` : ''}
          <section class="comments-section" data-id="${a.id}">
            <h4>Mga komento</h4>
            <div class="comments-list"></div>
            <div class="comment-composer">
              <textarea class="comment-text" rows="2" maxlength="1000" placeholder="Magtanong o mag-reply..."></textarea>
              <button class="btn add-comment" data-id="${a.id}" type="button">Comment</button>
            </div>
          </section>
        </article>`;
    }

    async function loadComments(announcementId) {
      const { ok, data } = await apiJson(`/comments?announcementId=${announcementId}`);
      const list = document.querySelector(`.comments-section[data-id="${announcementId}"] .comments-list`);
      if (!list) return;
      if (!ok) { list.innerHTML = '<p class="meta">Hindi na-load ang comments.</p>'; return; }
      if (!data.length) { list.innerHTML = '<p class="meta">Unang magtanong.</p>'; return; }
      const me = getUser();
      list.innerHTML = data.map((c) => {
        const canManage = me && (me.id === c.user_id || me.role === 'admin');
        return `
          <div class="comment" data-comment="${c.id}">
            <div class="comment-head">
              <strong>${escapeHtml(c.user?.full_name || 'Member')}</strong>
              <small>${formatDate(c.created_at, true)}</small>
            </div>
            <p class="comment-body">${escapeHtml(c.text)}</p>
            ${canManage ? `<div class="comment-actions">
              <button type="button" data-edit-comment="${c.id}">Edit</button>
              <button type="button" data-del-comment="${c.id}">Delete</button>
            </div>` : ''}
          </div>`;
      }).join('');
    }

    function bindCommentEvents(root) {
      root.querySelectorAll('.add-comment').forEach((btn) => {
        btn.onclick = async () => {
          const section = btn.closest('.comments-section');
          const text = section.querySelector('.comment-text').value.trim();
          if (!text) return;
          btn.disabled = true;
          const { ok, error } = await apiJson('/comments', {
            method: 'POST',
            body: JSON.stringify({ announcementId: btn.dataset.id, text })
          });
          btn.disabled = false;
          if (!ok) return showToast(error, 'error');
          section.querySelector('.comment-text').value = '';
          loadComments(btn.dataset.id);
        };
      });
      root.addEventListener('click', async (e) => {
        const del = e.target.closest('[data-del-comment]');
        const edit = e.target.closest('[data-edit-comment]');
        if (del) {
          if (!confirm('Delete this comment?')) return;
          const { ok, error } = await apiJson(`/comments?commentId=${del.dataset.delComment}`, { method: 'DELETE' });
          if (!ok) return showToast(error, 'error');
          loadComments(del.closest('.comments-section').dataset.id);
        }
        if (edit) {
          const wrap = edit.closest('.comment');
          const next = prompt('Edit comment', wrap.querySelector('.comment-body').textContent);
          if (next == null || !next.trim()) return;
          const { ok, error } = await apiJson('/comments', {
            method: 'PUT',
            body: JSON.stringify({ commentId: edit.dataset.editComment, text: next.trim() })
          });
          if (!ok) return showToast(error, 'error');
          loadComments(edit.closest('.comments-section').dataset.id);
        }
      });
    }

    loadAnnouncements();
  </script>
</body>
</html>
