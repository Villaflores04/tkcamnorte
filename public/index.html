<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anunsyo · TK Cam Norte</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/premium.css">
  <link rel="stylesheet" href="/css/fixes.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="mark">TK</div>
      <div class="brand-name">TK Cam Norte<small>Teatro Kristiano</small></div>
    </a>
    <div class="header-actions" id="headerActions">
      <button class="icon-btn" id="notifyBtn" type="button" aria-label="Notifications"><span class="icon" data-icon="bell" aria-hidden="true"></span><em id="notifyBadge" hidden>0</em></button>
      <button class="hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false"><span class="icon" data-icon="menu" aria-hidden="true"></span></button>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
  </header>
  <main class="container">
    <section class="home-hero">
      <div class="eyebrow">Magandang araw,</div>
      <h1 id="welcomeName">Kaibigan</h1>
      <p>Stay updated sa mga importanteng announcement ng TK Cam Norte.</p>
      <div class="hero-orbit" aria-hidden="true"></div>
      <div class="script" aria-hidden="true">Together<br>in His<br>Purpose</div>
    </section>
    <section class="section-head">
      <h2>Mga Anunsyo</h2>
      <div class="underline"></div>
      <p>Mga bagong update, schedules, deadlines, at activities.</p>
    </section>
    <div class="chip-row" id="filters" aria-label="Announcement categories"></div>
    <div id="announcementsList"></div>
  </main>
  <div id="bottomNavHost"></div>
  <script type="module">
    import {
      requireAuth, initShell, apiJson, escapeHtml, formatDate, relativeTime,
      deadlineMeta, categoryLabel, CATEGORIES, renderReactions, bindReactions,
      isAdmin, avatarUrl, firstName, bottomNav, coverOf, isOngoing, icon
    } from '/js/common.js';

    const user = await requireAuth();
    if (!user) throw new Error('auth');
    initShell(user);
    document.getElementById('welcomeName').textContent = firstName(user);
    document.getElementById('bottomNavHost').innerHTML = bottomNav('home');

    let currentCategory = 'all';
    const filters = document.getElementById('filters');
    filters.innerHTML = CATEGORIES.map((c) =>
      `<button class="chip ${c.id === 'all' ? 'active' : ''}" data-cat="${c.id}" aria-pressed="${c.id === 'all'}">${escapeHtml(c.label)}</button>`
    ).join('');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      currentCategory = btn.dataset.cat;
      filters.querySelectorAll('.chip').forEach((el) => {
        const active = el === btn;
        el.classList.toggle('active', active);
        el.setAttribute('aria-pressed', String(active));
      });
      loadAnnouncements();
    });

    function progressWidth(due) {
      if (!due || due.days == null) return 40;
      if (due.days < 0) return 100;
      if (due.days === 0) return 92;
      return Math.max(12, Math.min(88, 100 - due.days * 8));
    }

    function renderCard(a) {
      const due = deadlineMeta(a.deadline_date || a.ends_at);
      const author = a.created_by_user || {};
      const files = Array.isArray(a.attachments) ? a.attachments : [];
      const cover = coverOf(a);
      const count = a.comment_count || 0;
      const admin = isAdmin();
      const deadline = due ? `<div class="deadline-box"><strong>${icon('clock')}${escapeHtml(due.label.toUpperCase())}</strong><div class="bar"><span style="width:${progressWidth(due)}%"></span></div><span class="meta">${escapeHtml(formatDate(a.deadline_date || a.ends_at))}</span></div>` : '';
      const docs = files.filter((f) => !/\.(png|jpe?g|webp|gif)$/i.test(f.file_name || ''));
      return `<article class="card announcement cat-${escapeHtml(a.category)} ${a.is_pinned ? 'pinned' : ''}" data-post="${escapeHtml(a.id)}">
        <div class="tag-row">
          ${isOngoing(a) ? '<span class="badge badge-soon">Ongoing</span>' : ''}
          <span class="badge badge-cat">${escapeHtml(categoryLabel(a.category))}</span>
          ${a.is_pinned ? `<span class="badge badge-pin">${icon('pin')}PINNED</span>` : ''}
        </div>
        <div class="announcement-split">
          <div>
            <h3>${escapeHtml(a.title)}</h3>
            <p class="body-text">${escapeHtml(a.content)}</p>
            ${deadline}
          </div>
          ${cover ? `<img class="cover-thumb" src="${escapeHtml(cover)}" alt="">` : ''}
        </div>
        <div class="author-row">
          <img src="${escapeHtml(avatarUrl(author, author.full_name))}" alt="">
          <div>
            <strong>${escapeHtml(author.full_name || 'Coordinator')}</strong>
            <p class="meta">${relativeTime(a.created_at)}</p>
          </div>
        </div>
        ${docs.length ? `<div class="attachments">${docs.map((f) => `<a href="${escapeHtml(f.file_url)}" target="_blank" rel="noopener">${icon('doc')}${escapeHtml(f.file_name || 'File')}</a>`).join('')}</div>` : ''}
        <div class="card-foot">
          ${renderReactions(a)}
          <a class="see-all" href="/announcement.html?id=${encodeURIComponent(a.id)}">${icon('chat')}${count} comment${count === 1 ? '' : 's'} · See all</a>
        </div>
        ${admin ? `<div class="btn-row single"><a class="btn btn-ghost" href="/admin.html?edit=${encodeURIComponent(a.id)}">Edit</a></div>` : ''}
      </article>`;
    }

    async function loadAnnouncements() {
      const box = document.getElementById('announcementsList');
      box.innerHTML = '<div class="card empty">Loading announcements…</div>';
      const qs = currentCategory !== 'all' ? `?category=${encodeURIComponent(currentCategory)}` : '';
      const { ok, data, error } = await apiJson(`/announcements${qs}`);
      if (!ok) {
        box.innerHTML = `<div class="card empty">${escapeHtml(error)}</div>`;
        return;
      }
      if (!Array.isArray(data) || !data.length) {
        box.innerHTML = '<div class="card empty">Wala pang anunsyo sa category na ito.</div>';
        return;
      }
      box.innerHTML = data.map(renderCard).join('');
      bindReactions(box);
    }

    loadAnnouncements();
  </script>
</body>
</html>
